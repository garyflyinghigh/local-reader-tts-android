name: android_reader
description: A local TXT and EPUB reader with stable native TTS playback.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^11.0.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  epubx: ^4.0.0
  flutter_widget_from_html: ^0.17.2
  flutter_tts: ^4.2.5
  audio_service: ^0.18.17
  audio_session: ^0.2.3
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
